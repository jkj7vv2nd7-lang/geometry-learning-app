name: Windows launcher

on:
  push:
    paths:
      - "main.py"
      - "backend/**"
      - "frontend/**"
      - "launcher.py"
      - "geometry-learning-app.spec"
      - "requirements.txt"
      - "scripts/build-windows-launcher.ps1"
      - "tests/python/**"
      - ".github/workflows/windows-launcher.yml"
  pull_request:
    paths:
      - "main.py"
      - "backend/**"
      - "frontend/**"
      - "launcher.py"
      - "geometry-learning-app.spec"
      - "requirements.txt"
      - "scripts/build-windows-launcher.ps1"
      - "tests/python/**"
      - ".github/workflows/windows-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Test launcher logic
        run: python -m unittest discover -s tests/python -v
      - name: Build one-folder launcher
        shell: pwsh
        run: .\scripts\build-windows-launcher.ps1 -SkipInstall
      - uses: actions/upload-artifact@v4
        with:
          name: GeometryLearningApp-windows-x64
          path: dist/GeometryLearningApp/
          if-no-files-found: error
          retention-days: 14
